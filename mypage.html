<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- head 部分存放给浏览器看的信息（如标题、编码） -->
    <meta charset="UTF-8">
    <title>我的第一个网页</title>
</head>
<body>
    <!-- body 部分存放真正显示在网页上的内容 -->
    <h1>欢迎来到我的网站 🚀</h1>
    <p>这是我用 HTML 编写的第一行段落。</p>
    
    <!-- 插入一个超链接 -->
    <a href="https://github.com" target="_blank">点击这里访问 GitHub</a>
    
    <br><br> <!-- 换行 -->
    
    <!-- 插入一张图片（src 后面写图片网址或本地路径） -->
    <img src="https://picsum.photos" alt="示例图片">
</body>
</html>
